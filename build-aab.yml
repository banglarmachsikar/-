name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          GRADLE_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle project not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Gradle project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle bundleRelease --no-daemon

      - name: Find AAB
        run: |
          echo "Searching for AAB..."
          find "${PROJECT_DIR}" -type f -name "*.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglarMachShikar-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
