name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Gradle project
        run: |
          GRADLE_FILE=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Release AAB
        run: |
          cd "$GRADLE_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew bundleRelease
          else
            gradle bundleRelease
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: "**/build/outputs/bundle/release/*.aab"
